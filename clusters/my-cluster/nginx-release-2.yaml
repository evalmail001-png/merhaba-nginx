apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-nginx-2
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: nginx
      version: "23.0.5"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    replicaCount: 2
